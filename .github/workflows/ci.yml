name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bedrock:
    name: Bedrock (C++ / MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurer
        run: cmake -S . -B build -A x64
      - name: Compiler
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

  resource-pack:
    name: Pack de ressources Bedrock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer et vérifier
        run: python3 tools/make_resource_pack.py --check --out build/resource-pack
      - uses: actions/upload-artifact@v4
        with:
          name: umc-pvp-ui
          path: build/resource-pack/*.mcpack
          if-no-files-found: error

  java:
    name: Java (mod Fabric)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java/fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compiler et tester
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: umc-fabric
          path: java/fabric/build/libs/*.jar
          if-no-files-found: error
