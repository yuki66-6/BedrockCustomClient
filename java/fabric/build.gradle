plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'umc-fabric' }

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"umc" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Tests de la logique commune (profils, waypoints, capacités…), sans lancer le jeu.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Données communes Java/Bedrock embarquées dans le mod.
def sharedDir = file("../../shared")

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.dir sharedDir
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
	from(sharedDir) {
		include 'module-definitions/**', 'profiles/**', 'schemas/**', 'localization/**', 'themes/**'
		into 'assets/umc/shared'
	}
}

test {
	useJUnitPlatform()
	// Les tests lisent aussi les fichiers partagés directement depuis le dépôt.
	systemProperty 'umc.sharedDir', sharedDir.absolutePath
	testLogging { events 'failed'; exceptionFormat 'full' }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("../../README.md") { rename { "UMC-README.md" } }
}
